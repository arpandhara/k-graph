[package]
name = "kg"
version = "0.1.0"
edition = "2024"
authors = ["Rusty VCS Contributors"]
description = "High-performance multi-language code knowledge graph engine"

[lib]
name = "kg"
path = "src/lib.rs"

[[bin]]
name = "kg"
path = "src/main.rs"

[dependencies]
# Error Handling & Diagnostics
anyhow = "1.0.95"
thiserror = "2.0.11"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }

# CLI & Formatting
clap = { version = "4.5.28", features = ["derive", "cargo"] }

# Data Serialization
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
bincode = "1.3.3"

# Concurrency & Data Structures
rayon = "1.10.0"
dashmap = "6.1.0"
parking_lot = "0.12.3"
smallvec = { version = "1.13.2", features = ["serde"] }

# Graph Data Structures
petgraph = { version = "0.7.1", features = ["serde-1"] }

# Storage Engine (for persistence)
redb = "2.3.0"
memmap2 = "0.9.5"

# Multi-Language Tree-Sitter Parsers (ready for Phase 2)
tree-sitter = "0.24.7"
tree-sitter-language = "0.1.3"
tree-sitter-rust = "0.23.2"
tree-sitter-python = "0.23.6"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.23.4"

# Hashing & File Walking
sha2 = "0.10.8"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.16.0"
